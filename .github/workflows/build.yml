name: Build Last Toll

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable

# Plain Godot 4.3 (GDScript only, no .NET), so the project can also export to
# the web. Runs on the Ubuntu runner (it ships the Android SDK) with Java 17
# and the official Godot editor + export templates.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.3 + export templates
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo ln -sf "$RUNNER_TEMP/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o tpl.tpz "$GODOT_URL/Godot_v4.3-stable_export_templates.tpz"
          unzip -q tpl.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          ls ~/.local/share/godot/export_templates/4.3.stable/
          godot --version

      - name: Android SDK paths and debug key
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      # Release signing. With repo secrets ANDROID_KEYSTORE_B64 (base64 of a .jks/.p12),
      # ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD every build shares one
      # signature, so a new APK installs over the old one. Without them a throwaway
      # key is made per run (Android then needs the old build uninstalled first).
      - name: Android release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_ALIAS" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "Using the stable release key from repo secrets"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass android -alias lasttoll \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Last Toll,O=Tylerlikesps4,C=US"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=lasttoll" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> $GITHUB_ENV
            echo "No release key secret: using a per-run key"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          # Every build gets a higher versionCode so Android treats it as an update.
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          grep "version/code" export_presets.cfg

      - name: Import project
        run: timeout 300 godot --headless --editor --quit || true

      - name: Smoke test (automated playthrough)
        continue-on-error: true
        run: |
          timeout 300 godot --headless -- --smoke 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee smoke.log || true
          grep -E "^(PASS|FAIL)" smoke.log
          ! grep -q "^FAIL" smoke.log
          grep -q "SMOKE DONE" smoke.log

      - name: Export Windows
        run: |
          mkdir -p out
          mkdir -p out/win
          godot --headless --export-release "Windows Desktop" "$PWD/out/win/LastToll.exe"
          ls -laR out/win | head -40
          test -f out/win/LastToll.exe
          cp tools/pc/README-PC.txt out/win/README.txt
          (cd out/win && zip -qr ../LastToll-Windows.zip .)
          ls -la out

      - name: Export Linux
        run: |
          mkdir -p out/linux
          godot --headless --export-release "Linux" "$PWD/out/linux/LastToll.x86_64"
          test -f out/linux/LastToll.x86_64
          chmod +x out/linux/LastToll.x86_64
          cp tools/pc/README-PC.txt out/linux/README.txt
          ls -la out/linux
          (cd out/linux && zip -qr ../LastToll-Linux.zip .)

      - name: Export Android APK
        run: |
          # Release template (smaller and faster than the debug one).
          godot --headless --export-release "Android" "$PWD/out/LastToll.apk"
          ls -la out
          test -f out/LastToll.apk
          unzip -l out/LastToll.apk | sort -nr | head -12
          ! unzip -l out/LastToll.apk | grep -E "\.a$|assets/out/"

      - name: Export Web (HTML5, no threads for itch.io)
        run: |
          mkdir -p out/web
          godot --headless --export-release "Web" "$PWD/out/web/index.html"
          ls -la out/web
          test -f out/web/index.html
          test -f out/web/index.wasm
          test -f out/web/index.pck
          # itch.io wants index.html at the root of the zip.
          (cd out/web && zip -qr ../LastToll-Web.zip .)
          unzip -l out/LastToll-Web.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LastToll-builds
          path: |
            out/LastToll.apk
            out/LastToll-Windows.zip
            out/LastToll-Linux.zip
            out/LastToll-Web.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Last Toll build ${{ github.run_number }}
          body: "Harrow's Wake - Last Toll, a Super Free AI Game Jam #2 entry (Godot 4.3). Browser - LastToll-Web.zip is the HTML5 build (upload to itch.io as playable in the browser, or unzip and serve index.html). Windows - extract LastToll-Windows.zip and run LastToll.exe. Linux - extract LastToll-Linux.zip and run LastToll.x86_64. Android - install LastToll.apk (allow installs from your browser). README.txt in the zips has the controls. Headphones recommended."
          files: |
            out/LastToll.apk
            out/LastToll-Windows.zip
            out/LastToll-Linux.zip
            out/LastToll-Web.zip
